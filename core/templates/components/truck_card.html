<div class="truck-card card p-3 mb-3 shadow-sm">
    <h5 class="mb-2">Truck {{truck.id}}</h5>
    <p>Vin: {{truck.vin}}</p>
    <p>Brand: {{truck.brand}}</p>
    <p>Year: {{truck.year}}</p>
    <p>Mileage: {{truck.mileage}}</p>
    <p>Truck Status: {{truck.truck_status}}</p>
    <p>Truck Location: {{truck.truck_location}}</p>
    <button class="btn btn-primary">Save</button>
</div>
